name: Build & Attach Extension

on:
  release:
    types: [published]

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'v') && !startsWith(github.event.release.tag_name, 'models-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXTENSION_DIST: apps/extension/dist

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Find latest model release tag
        id: models
        run: |
          TAG=$(gh release list --repo ${{ github.repository }} \
            --json tagName --jq '.[] | select(.tagName | startswith("models-")) | .tagName' \
            | head -1)
          if [ -z "$TAG" ]; then
            echo "ERROR: No models-* release found. Create a model release first."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download model files
        run: npm run models:download -- "${{ steps.models.outputs.tag }}" --force

      - name: Run quality gate
        run: npm run check

      - name: Verify version matches release tag
        run: |
          TAG_VERSION="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          MANIFEST_VERSION=$(jq -r .version "$EXTENSION_DIST/manifest.json")
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "ERROR: Release tag version ($TAG_VERSION) != manifest.json version ($MANIFEST_VERSION)"
            exit 1
          fi
          echo "Version check passed: $TAG_VERSION"

      - name: Verify model files in extension dist
        run: |
          if find "$EXTENSION_DIST/models" -name '*.onnx' | grep -q .; then
            echo "ONNX files present in $EXTENSION_DIST/models/"
          else
            echo "ERROR: Missing bundled ONNX files in $EXTENSION_DIST/models/"
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { collectModelAssets } from './scripts/model-release-assets.mjs';
          import { existsSync } from 'node:fs';
          import { join } from 'node:path';

          const dist = process.env.EXTENSION_DIST;
          const assets = await collectModelAssets(join(dist, 'models/models.json'));
          for (const file of assets) {
            if (!existsSync(join(dist, 'models', file))) {
              console.error(`ERROR: Missing ${file} in ${dist}/models/`);
              process.exit(1);
            }
          }
          console.log(`Verified model assets: ${assets.join(', ')}`);
          NODE
          if [ -f "$EXTENSION_DIST/models/ocr.onnx" ]; then
            echo "ERROR: Legacy AR ocr.onnx must not be bundled in the Paddle-only release"
            exit 1
          fi
          echo "All manifest model files present in $EXTENSION_DIST/models/"

      - name: Create extension zip
        run: |
          cd "$EXTENSION_DIST"
          zip -r "$GITHUB_WORKSPACE/ShinobuTranslator.zip" .

      - name: Upload zip to release
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            ShinobuTranslator.zip \
            --repo ${{ github.repository }} \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
