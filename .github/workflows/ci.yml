name: Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      EXTENSION_CHROMIUM_DIST: apps/extension/dist-chromium
      EXTENSION_FIREFOX_DIST: apps/extension/dist-firefox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read pinned model release
        id: models
        run: echo "tag=$(jq -r .tag apps/extension/model-release.json)" >> "$GITHUB_OUTPUT"

      - name: Download and verify pinned models
        run: npm run models:download -- "${{ steps.models.outputs.tag }}"

      - name: Run quality gate
        run: npm run check

      - name: Audit Firefox lint warnings
        run: npm run lint:firefox --workspace=@shinobu/extension

      - name: Verify reproducible dual-target build
        run: npm run check:extension-reproducible

      - name: Upload dual-target smoke inputs
        uses: actions/upload-artifact@v4
        with:
          name: extension-builds
          path: |
            apps/extension/dist-chromium
            apps/extension/dist-firefox
          retention-days: 2

      - name: Check models.dev thinking capability drift
        run: npm run llm-thinking:check-drift

  chromium-smoke:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: extension-builds
          path: apps/extension
      - name: Install project Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Chromium DNR and content-script smoke
        run: xvfb-run --auto-servernum npx tsx benchmark/perf/src/run-browser-image-download-smoke.ts

  firefox-smoke:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        firefox: [latest-esr, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: ${{ matrix.firefox }}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: extension-builds
          path: apps/extension
      - name: Load Firefox extension
        run: xvfb-run --auto-servernum node scripts/smoke-firefox-load.mjs --dist apps/extension/dist-firefox --firefox "${{ steps.firefox.outputs.firefox-path }}"
