name: Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize canonical model inventory
        run: npm run models:download -- latest --force
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run quality gate
        run: npm run check

      - name: Check models.dev thinking capability drift
        run: npm run llm-thinking:check-drift
